name: Verify Ruffle iframe compatibility

on:
  push:
    branches: [main]
    paths:
      - "scripts/test-ruffle-iframe.mjs"
      - "Bloons TD 2/**"
      - "Bloons TD 4/**"
      - "Learn to Fly 2/**"
      - ".github/workflows/verify-ruffle-iframe.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check script syntax
        run: node --check scripts/test-ruffle-iframe.mjs
      - name: Test Ruffle in tabs and iframe.srcdoc
        run: node scripts/test-ruffle-iframe.mjs
      - name: Upload screenshots and JSON diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-iframe-verification
          path: artifacts/ruffle-iframe-comparison.json
          if-no-files-found: ignore
          retention-days: 30
