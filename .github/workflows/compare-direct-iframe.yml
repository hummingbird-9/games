name: Compare direct iframe and srcdoc game loading

on:
  push:
    branches: [main]
    paths:
      - "scripts/test-direct-iframe-vs-srcdoc.mjs"
      - "Among Us/**"
      - "Boxing Random/**"
      - "Fruit Merge/**"
      - "Big NEON Tower Tiny Square/**"
      - ".github/workflows/compare-direct-iframe.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check script syntax
        run: node --check scripts/test-direct-iframe-vs-srcdoc.mjs
      - name: Compare srcdoc and direct iframe URL
        run: node scripts/test-direct-iframe-vs-srcdoc.mjs
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-iframe-vs-srcdoc
          path: artifacts/direct-iframe-vs-srcdoc.json
          if-no-files-found: ignore
          retention-days: 30
