name: Offline game verification

on:
  push:
    branches: [main]
    paths:
      - 'Webecomewhatwebehold/**'
      - 'Idlebreakout/**'
      - '.github/workflows/offline-game-verification.yml'
      - '.github/scripts/offline-game-smoke.mjs'
      - 'repair-reports/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the games under test
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            Webecomewhatwebehold
            Idlebreakout
            repair-reports
          sparse-checkout-cone-mode: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/offline-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/offline-http.log
          exit 1
      - name: Run offline browser tests
        run: node .github/scripts/offline-game-smoke.mjs
