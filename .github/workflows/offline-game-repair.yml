name: Offline game repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-game-repair.yml"
      - "scripts/repair_batch_2026_11_15.py"
      - "tests/offline-game-smoke-2026-11-15.cjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: offline-game-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for pinned upstream builds
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"

      - name: Validate repair scripts
        run: |
          python3 -c 'import ast; ast.parse(open("scripts/repair_batch_2026_11_15.py", encoding="utf-8").read())'
          node --check tests/offline-game-smoke-2026-11-15.cjs

      - name: Install Chromium and Playwright
        run: |
          npm install --prefix /tmp/offline-game-deps playwright@1.55.0
          /tmp/offline-game-deps/node_modules/.bin/playwright install --with-deps chromium

      - name: Run three separate repair batches and commit each to main
        env:
          PLAYWRIGHT_PATH: /tmp/offline-game-deps/node_modules/playwright
          REPAIR_DATE: "2026-11-15"
        run: python3 scripts/repair_batch_2026_11_15.py
