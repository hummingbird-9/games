name: Offline game repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-game-repair.yml"
      - "scripts/repair_batch_2026_11_15.py"
      - "tests/offline-game-smoke-2026-11-15.cjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: offline-game-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            .github
            scripts
            tests
            repair-reports
            1-date-danger
            12-mini-battles
            2048-merge-run
            3d-bolt-master
            3d-bowling
            60-seconds-reatomized
            8-ball-classic
            8-ball-pool
            a-bite-at-freddys
            a-dance-of-fire-and-ice
            a-difficult-game-about-climbing
            a-game-about-feeding-a-black-hole
            a-small-world-cup
            abandoned
            ace-attorney-investigations--miles-edgeworth
            achievement-unlocked
            achievement-unlocked-2
            achievement-unlocked-3
            adventure-capatalist
            adventure-drivers
            ages-of-conflict
            alien-hominid
            amanda-the-adventurer
            amaze
            andys-apple-farm
            angry-birds
            angry-birds-chrome
            angry-birds-showdown
            animal-crossing-gamecube
            antonblast
            apes-vs-helium
            apollo-justice--ace-attorney
            aquaparkio
            archery-world-tour
            arthurs-nightmare
            attack-hole
            aviamasters
            awesome-tanks
            awesome-tanks-2
            azahar-emulator
            backrooms
            bacon-may-die
            bad-ice-cream
            bad-ice-cream-2
            bad-ice-cream-3
            bad-monday-simulator
            bad-parenting-1
            bad-piggies
            bad-time-simulator
            balatro
            baldis-basics
            baldis-basics-classic-remastered
            baldis-basics-plus
            baldis-basics-the-ultra-decompile
            ball-blast
            bank-robbery
            bank-robbery-2
            bank-robbery-3
            bart-bash
            bart-blast
            baseball-bros
            basket-battle
            basket-bros
            basket-random
            basketball-frvr
            basketball-stars
            bazooka-boy
            beatblock
            bendy-and-the-ink-machine
            bendy-and-the-ink-machine-all-chapters
            bergentruck-201x
            bfdi-branches
            bfdia-5b
            big-ice-tower-tiny-square
            big-neon-tower-tiny-square
            big-tower-tiny-square
            big-tower-tiny-square-2
            binding-of-issac-wrath-of-the-lamb
            bitgunio
            bitplanes
            blackjack
            blade-ball
            block-blast
            blockpost
            blocky-snakes
            bloodmoney
            bloons-td
            bloons-td-2
            bloons-td-3
            breaklock
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for pinned upstream builds
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"

      - name: Validate repair scripts
        run: |
          python3 -c 'import ast; ast.parse(open("scripts/repair_batch_2026_11_15.py", encoding="utf-8").read())'
          node --check tests/offline-game-smoke-2026-11-15.cjs

      - name: Install Chromium and Playwright
        run: |
          npm install --prefix /tmp/offline-game-deps playwright@1.55.0
          /tmp/offline-game-deps/node_modules/.bin/playwright install --with-deps chromium

      - name: Run three separate repair batches and commit each to main
        env:
          PLAYWRIGHT_PATH: /tmp/offline-game-deps/node_modules/playwright
          REPAIR_DATE: "2026-11-15"
        run: python3 scripts/repair_batch_2026_11_15.py
