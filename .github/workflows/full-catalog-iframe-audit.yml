name: Full catalog iframe and load diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-catalog-iframe-audit.yml"
      - "scripts/diagnose-all-games.mjs"

permissions:
  contents: write

concurrency:
  group: full-catalog-iframe-audit
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the full game collection
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check diagnostic script syntax
        run: |
          node --check scripts/diagnose-all-games.mjs
          node --check scripts/test-ruffle-iframe.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test all games in a tab and an iframe
        run: node scripts/diagnose-all-games.mjs
      - name: Commit diagnostic report
        if: always()
        run: |
          if [ -f repair-reports/2026-11-16-full-catalog-iframe-audit.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repair-reports/2026-11-16-full-catalog-iframe-audit.md
            if ! git diff --cached --quiet; then
              git commit -m "Add full catalog iframe diagnostic report"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-catalog-iframe-diagnostic
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
