name: Inspect Awesome Tanks menu flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-awesome-tanks-menu.yml"
      - "scripts/inspect-awesome-tanks-menu.mjs"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            Awesome Tanks
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install offline browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect menu and input flow with external requests blocked
        run: node scripts/inspect-awesome-tanks-menu.mjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awesome-tanks-menu-diagnostic
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
