name: Offline game repair batch 03

on:
  workflow_run:
    workflows: ["Offline game repair batch 02"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: offline-game-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out only batch 03 candidates and repair tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Ages of Conflict
            Angry Birds Showdown
            Aquapark.io
            Attack Hole
            Aviamasters
            Awesome Tanks
            Bank Robbery 2
            Basketball Frvr
            repair-reports
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned offline browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Replace or remove batch 03 entries and commit one batch
        run: BATCH=3 bash scripts/repair-batch-02-03.sh

      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-repair-batch-03-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
