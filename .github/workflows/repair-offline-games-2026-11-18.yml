name: Offline game repair — 2026-11-18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-offline-games-2026-11-18.yml"
      - "scripts/repair-offline-games-2026-11-18.sh"
      - "scripts/verify-repair-offline-games-2026-11-18.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-game-repair-2026-11-18
  cancel-in-progress: false

jobs:
  batch1:
    name: Batch 01 — Doodle Jump
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the existing game and repair tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Doodle Jump
            repair-reports
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned offline browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Replace, test offline, report and commit batch 01
        run: bash scripts/repair-offline-games-2026-11-18.sh 1
      - name: Upload batch 01 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-repair-batch-01-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  batch2:
    name: Batch 02 — Crossy Road
    needs: batch1
    if: needs.batch1.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the latest main and repair tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Crossy Road
            repair-reports
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned offline browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Replace, test offline, report and commit batch 02
        run: bash scripts/repair-offline-games-2026-11-18.sh 2
      - name: Upload batch 02 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-repair-batch-02-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  batch3:
    name: Batch 03 — Google Snake
    needs: batch2
    if: needs.batch2.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the latest main and repair tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Google Snake
            repair-reports
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned offline browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Replace, test offline, report and commit batch 03
        run: bash scripts/repair-offline-games-2026-11-18.sh 3
      - name: Upload batch 03 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-repair-batch-03-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
