<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#05070d">
  <title>Among Us 2026</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #05070d; }
  </style>
</head>
<body>
  <iframe
    id="game"
    title="Among Us 2026"
    src="https://wasm.rip/files/amongus/latest/"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
