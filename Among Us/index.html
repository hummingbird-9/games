<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#05070d">
  <title>Among Us — Online + Freeplay</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #05070d; }
    #links {
      position: fixed; z-index: 5; right: 10px; bottom: 10px;
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px;
      max-width: calc(100vw - 20px);
      font: 12px/1.3 system-ui, sans-serif;
    }
    #links a {
      color: #fff; text-decoration: none; background: rgba(12,16,26,.82);
      border: 1px solid rgba(255,255,255,.24); border-radius: 7px;
      padding: 7px 10px; backdrop-filter: blur(8px);
    }
    #links a:hover { background: rgba(42,54,78,.95); }
  </style>
</head>
<body>
  <iframe
    id="game"
    title="Among Us 2026 and Legacy browser ports"
    src="https://wasm.rip/files/amongus/index.html"
    allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <nav id="links" aria-label="Game alternatives">
    <a href="https://wasm.rip/files/amongus/index.html" target="_blank" rel="noopener noreferrer">Open loader in new tab ↗</a>
    <a href="singleplayer.html">Previous offline build</a>
  </nav>
</body>
</html>
