<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  
  <title>Plague Inc – Low RAM Mode</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
    }

    /* ── Canvas is rendered at 75% physical size, scaled up via CSS ── */
    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: auto;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0b0b0b;
      color: white;
      font-family: sans-serif;
      z-index: 10;
    }

    #loader-title {
      font-size: 13px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #text {
      font-size: 14px;
      color: #d1d5db;
    }

    #bar {
      width: 60%;
      max-width: 340px;
      height: 10px;
      background: #1f2937;
      border-radius: 5px;
      overflow: hidden;
    }

    #fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #15803d, #4ade80);
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    #loader-sub {
      font-size: 11px;
      color: #6b7280;
    }

    #chunk-status {
      font-size: 11px;
      color: #4ade80;
      min-height: 16px;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div id="loader-title">⚡ Low RAM Mode</div>
    <div id="text">Preparing download…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="chunk-status"></div>
    <div id="loader-sub">Loading sequentially to reduce memory usage</div>
  </div>

  <canvas id="unity-canvas"></canvas>

  <script>
    // ── Low RAM Mode: Reduce devicePixelRatio so Unity renders at 75% resolution ──
    Object.defineProperty(window, 'devicePixelRatio', {
      get: () => 0.75,
      configurable: true
    });

    // Reduce AudioContext sample rate
    const _OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
    if (_OrigAudioCtx) {
      const _PatchedAudioCtx = function(opts) {
        const options = Object.assign({ sampleRate: 22050 }, opts || {});
        return new _OrigAudioCtx(options);
      };
      _PatchedAudioCtx.prototype = _OrigAudioCtx.prototype;
      window.AudioContext = _PatchedAudioCtx;
      if (window.webkitAudioContext) window.webkitAudioContext = _PatchedAudioCtx;
    }
  </script>

  <script src="_ext/cdn.jsdelivr.net/gh/Reeyuki/PlagueIncEvolved/Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js"></script>

  <script>
    const baseBuild = "https://cdn.jsdelivr.net/gh/Reeyuki/PlagueIncEvolved/Build/"
    const base = "https://cdn.jsdelivr.net/gh/Reeyuki/PlagueIncEvolved/"

    let loaded = 0
    const totalGuess = 332398592

    const textEl = document.getElementById("text")
    const fillEl = document.getElementById("fill")
    const chunkEl = document.getElementById("chunk-status")

    function update() {
      const mb = (loaded / 1024 / 1024).toFixed(1)
      const total = (totalGuess / 1024 / 1024).toFixed(0)
      textEl.textContent = mb + " MB / ~" + total + " MB"
      fillEl.style.width = Math.min(loaded / totalGuess * 100, 100) + "%"
    }

    // Fetch a single part and immediately return its bytes
    async function fetchPart(url, label) {
      chunkEl.textContent = "Fetching " + label + "…"
      const res = await fetch(url)
      if (!res.ok) throw new Error("Failed: " + url)
      const buf = await res.arrayBuffer()
      loaded += buf.byteLength
      update()
      return new Uint8Array(buf)
    }

    // ── Sequential chunk loading with CONCURRENCY_LIMIT ─────────────────
    // Normal mode fetches all 17 parts at once (~330 MB peak).
    // Low RAM mode fetches CONCURRENCY_LIMIT parts at a time, reducing
    // the number of large buffers held in memory simultaneously.
    const CONCURRENCY_LIMIT = 2

    async function loadFileSequential(name, parts) {
      const urls = []
      for (let i = 0; i < parts; i++) {
        urls.push({
          url: baseBuild + name + ".part" + String(i).padStart(2, "0"),
          label: name.slice(0, 8) + "… part " + (i + 1) + "/" + parts
        })
      }

      const chunks = []
      let totalSize = 0

      // Fetch CONCURRENCY_LIMIT parts at a time
      for (let i = 0; i < urls.length; i += CONCURRENCY_LIMIT) {
        const batch = urls.slice(i, i + CONCURRENCY_LIMIT)
        const results = await Promise.all(
          batch.map(({ url, label }) => fetchPart(url, label))
        )
        for (const r of results) {
          chunks.push(r)
          totalSize += r.byteLength
        }
        // Small yield so the browser can process GC and repaint
        await new Promise(r => setTimeout(r, 10))
      }

      // Assemble all chunks into a single buffer
      chunkEl.textContent = "Assembling " + name.slice(0, 8) + "…"
      const out = new Uint8Array(totalSize)
      let off = 0
      for (const chunk of chunks) {
        out.set(chunk, off)
        off += chunk.byteLength
        // Null out the chunk reference as we go so GC can reclaim it
        chunks[chunks.indexOf(chunk)] = null
      }
      chunkEl.textContent = ""

      return out.buffer
    }

    async function start() {
      try {
        // Load WASM first (smaller, 2 parts), then data (15 parts)
        // Loading sequentially rather than in parallel keeps peak RAM lower
        chunkEl.textContent = "Loading game engine…"
        const wasm = await loadFileSequential(
          "6b69ec426bff8a6bd4e760a1d5f507b9.wasm", 2
        )

        chunkEl.textContent = "Loading game data…"
        const data = await loadFileSequential(
          "3719aa6c33bf126ed64864ee5fc2fafc.data", 15
        )

        // Create object URLs and immediately free the large ArrayBuffers
        const wasmBlob = new Blob([wasm], { type: "application/wasm" })
        const wasmUrl = URL.createObjectURL(wasmBlob)

        const dataBlob = new Blob([data])
        const dataUrl = URL.createObjectURL(dataBlob)

        // Hide loader
        document.getElementById("loader").style.display = "none"

        // Start Unity
        const instance = await createUnityInstance(
          document.querySelector("#unity-canvas"),
          {
            dataUrl: dataUrl,
            frameworkUrl: baseBuild + "b4b58f3ff6d98fbfb83482e25e0e9a5c.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: base + "StreamingAssets",
            companyName: "Ndemic Creations",
            productName: "Plague Inc",
            productVersion: "1.18.3.2"
          }
        )

        // Revoke blob URLs once Unity has consumed them to free memory
        setTimeout(() => {
          URL.revokeObjectURL(wasmUrl)
          URL.revokeObjectURL(dataUrl)
        }, 5000)

        // Store instance so parent page can cleanly unload the game
        window._unityInstance = instance

      } catch (err) {
        textEl.textContent = "Error loading game: " + err.message
        chunkEl.textContent = "Try refreshing the page."
        console.error(err)
      }
    }

    start()
  </script>

  <script>
    // Clean up when this frame is unloaded (e.g. when player exits game)
    window.addEventListener('beforeunload', () => {
      if (window._unityInstance) {
        try { window._unityInstance.Quit(); } catch(_) {}
      }
    })
  </script>

</body>

</html>
