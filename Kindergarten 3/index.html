<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#050505">
  <base href="https://cdn.jsdelivr.net/gh/slqntdevss/Kindergarten3Port/">
  <title>Kindergarten 3</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #050505; }
    #loading-message {
      position: fixed; z-index: 2; inset: 0; display: grid; place-content: center;
      padding: 24px; color: #fff; background: #050505; font: 16px system-ui, sans-serif;
      text-align: center; overflow-wrap: anywhere;
    }
    #loading-message.error { color: #ffb4b4; }
  </style>
</head>
<body>
  <div id="loading-message">Loading Kindergarten 3…</div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('unity-canvas');
      const message = document.getElementById('loading-message');

      function showError(error) {
        console.error('Kindergarten 3 failed to load:', error);
        message.classList.add('error');
        message.textContent = 'Kindergarten 3 could not load. ' +
          (error && error.message ? error.message : String(error));
      }

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(window.innerWidth * ratio));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * ratio));
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      async function mergeParts(file, count) {
        const chunks = [];
        for (let i = 1; i <= count; i++) {
          const url = file + '.part' + i;
          const response = await fetch(url);
          if (!response.ok) throw new Error(url + ' returned HTTP ' + response.status);
          chunks.push(await response.arrayBuffer());
        }
        return URL.createObjectURL(new Blob(chunks));
      }

      Promise.all([
        mergeParts('Build/Kindergarten3Port.data', 2),
        mergeParts('Build/Kindergarten3Port.wasm', 3)
      ]).then(([dataUrl, wasmUrl]) => {
        const loader = document.createElement('script');
        loader.src = 'Build/Kindergarten3Port.loader.js';
        loader.onerror = () => showError(new Error('The Unity loader script could not be downloaded.'));
        loader.onload = () => {
          if (typeof createUnityInstance !== 'function') {
            showError(new Error('The Unity loader did not initialize.'));
            return;
          }
          createUnityInstance(canvas, {
            dataUrl,
            frameworkUrl: 'Build/Kindergarten3Port.framework.js',
            codeUrl: wasmUrl,
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'Con Man Games',
            productName: 'Kindergarten3',
            productVersion: '0.01'
          }, progress => {
            message.textContent = 'Loading Kindergarten 3… ' + Math.round(progress * 100) + '%';
          }).then(() => {
            message.remove();
          }).catch(showError);
        };
        document.body.appendChild(loader);
      }).catch(showError);
    })();
  </script>
</body>
</html>
